    <div class="stat"><span class="lbl">Delegação</span><b>${all.filter(s=>s.u==="D").length}</b></div>
    <div class="stat"><span class="lbl">Família & conv.</span><b>${all.filter(s=>s.u==="F").length}</b></div>
    <div class="stat"><span class="lbl">Ônibus</span><b>${all.filter(s=>/BUS/.test(s.v)).length}</b></div></div>
  <div class="bar-row"><div class="seg" role="group" aria-label="Visualização">
    <button aria-pressed="${st.tv==="tl"}" data-tv="tl">Timeline</button><button aria-pressed="${st.tv==="veh"}" data-tv="veh">Por veículo</button><button aria-pressed="${st.tv==="frota"}" data-tv="frota">Frota CAM</button></div>
    <button class="btn wa sm" data-msg>💬 Mensagem da frota</button></div>
  <div class="chips">${[["all","Todos"],["D","Delegação"],["F","Família & convidados"]].map(([k,t])=>`<button class="chip" aria-pressed="${st.who===k}" data-who="${k}">${t}</button>`).join("")}
  ${st.tv==="tl"?`<button class="chip" aria-pressed="${st.prog}" data-prog>Programação</button>`:""}</div>`;
  return h+(st.tv==="tl"?timeline(l):st.tv==="frota"?frota(l):vehicles(l));
}
function timeline(l){
  const items=[];
  l.forEach(s=>{let last=s.ini||"";s.legs.forEach((g,i)=>{if(g.h)last=g.h;items.push({k:(last||"99:99")+(g.h?"0":"1")+String(i).padStart(2,"0"),t:"v",s,g,i})})});
  if(st.prog&&PROG[st.day])PROG[st.day].forEach(p=>items.push({k:p[0]+"/",t:"p",p}));
  items.sort((a,b)=>a.k.localeCompare(b.k));
  return `<div class="card tl">${items.map(it=>{
    if(it.t==="p"){const p=it.p;return `<div class="tl-i prog ${p[3]?"key":""}"><span class="time">${p[0]}</span><span class="ic">▪</span><span class="t"><b>${esc(p[1])}</b> <span class="sub">· ${esc(p[2])}</span></span></div>`}
    const {s,g,i}=it, r=g.r||s.r, gr=g.g||s.g;
    return `<button class="tl-i veh" data-goveh="${s.id}"><span class="time ${g.h?"":"na"}">${g.h||"—"}</span><span class="ic">${emo(s.v)}</span>
      <span class="t"><b>${esc(veh(s.v))}</b>${s.pax==="BACKUP"?' <span class="pill p-gold">backup</span>':""}${s._ed?' <span class="pill p-info">'+(s._new?"novo":"editado")+'</span>':""} <span class="sub">· ${esc(grp(gr))}</span>
      <div class="route">${esc(pl(g.o))} → ${esc(pl(g.de))}</div>
      <span class="sub">${i>0?"trecho "+(i+1)+" · ":""}${esc(nice(r||"sem responsável"))}${g.obs?" · "+esc(g.obs):""}</span></span></button>`}).join("")}</div>
  <p class="note">Horários da planilha de transporte. “—” é trecho sem horário fixo (volta ou disposição).</p>`;
}
function vehicles(l){
  const D=l.filter(s=>s.u==="D"),F=l.filter(s=>s.u==="F");
  const card=s=>`<div class="card" id="veh-${s.id}"${st.openV===s.id?' style="border-color:var(--gold)"':""}>
    <div class="vh"><span class="time ${s.ini?"":"na"}">${s.ini||"--:--"}</span>
      <span class="t"><b>${emo(s.v)} ${esc(veh(s.v))}</b><br><span class="sub">${esc(actLabel(s))}</span></span>
      <span class="pills"><span class="pill p-gold">nº ${esc(s.n)}</span>${s.ped==="CONMEBOL"?'<span class="pill p-info">CONMEBOL</span>':""}${s.conf==="CONFIRMADO"?'<span class="pill p-ok">Confirmado</span>':""}</span></div>
    <div class="kv"><span>Grupo <b>${esc(grp(s.g)||"—")}</b></span><span>Resp. <b>${esc(nice(s.r||"—"))}</b></span>
      <span>Cap. <b>${esc(s.cap||"—")}</b>${s.pax&&s.pax!=="-"?` · <b>${esc(s.pax==="BACKUP"?"backup":s.pax+" pax")}</b>`:""}</span>
      <span>Disposição <b class="mono">${s.ini?s.ini+"–"+s.fim:"—"}</b></span></div>
    <div class="legs">${s.legs.map(g=>`<div class="leg"><span class="time ${g.h?"":"na"}" style="font-size:13.5px">${g.h||"—"}</span><span class="dot"></span>
      <span class="t">${esc(pl(g.o))} → ${esc(pl(g.de))}${g.g||g.r?`<br><span class="sub">${esc([g.g?grp(g.g):"",g.r?nice(g.r):""].filter(Boolean).join(" · "))}</span>`:""}${g.obs?`<br><span class="sub">${esc(g.obs)}</span>`:""}</span></div>`).join("")}</div>
    ${s._ed||canEdit()?`<div class="vfoot">${edInfo(s)||"<span></span>"}${ebtn("svc",s.id)}</div>`:""}</div>`;
  return (canEdit()?`<div class="addrow"><button class="btn o sm" data-new="svc">+ Novo veículo</button></div>`:"")+(D.length?`<div class="group">Delegação · ${D.length}</div>${D.map(card).join("")}`:"")+(F.length?`<div class="group">Família & convidados · ${F.length}</div>${F.map(card).join("")}`:"");
}

/* ---------- FROTA CAM (setor / veículo / responsável) ---------- */
function setor(s){const v=s.v.toUpperCase(),g=s.g.toUpperCase();
  if(/CAMI|CARGA/.test(v))return "Bagagens";
  if(["MKT","ANTIDOPING","AVANÇADA","DOPING","AVANZADA","DIRECTIVO"].includes(g)||/SUV/.test(v)||(/SEDAN/.test(v)&&!/FAM/.test(g))||/^BACKUP/.test(s.act))return "Apoio";
  return "Passageiros"}
function frota(l){
  const side=(list,name)=>{
    const body=["Bagagens","Passageiros","Apoio"].map(se=>{const x=list.filter(s=>setor(s)===se);if(!x.length)return "";
      return `<div class="fr-set"><span class="lbl">${se} · ${x.length}</span>${x.map(s=>`<button class="fr-row" data-goveh="${s.id}">
        <span class="time ${s.ini?"":"na"}">${s.ini||"--:--"}</span><span class="t">${emo(s.v)} <b>${esc(veh(s.v))}</b>${s.pax==="BACKUP"?' <span class="pill p-gold">backup</span>':""}
        ${["","PLANTEL","DELEGAÇÃO","DELEGACIÓN","FAMILIARES"].includes(s.g.toUpperCase())?"":`<span class="sub">· ${esc(grp(s.g))}</span>`}</span>
        <span class="fr-r">${esc(nice(s.r&&s.r!=="-"?s.r:"—"))}</span></button>`).join("")}</div>`}).join("");
    return `<div class="card fr"><div class="fr-h"><b>${name}</b><span class="sub">${list.length} veículo${list.length===1?"":"s"}</span></div>${body||`<div class="empty">Sem veículos.</div>`}</div>`};
  return side(l.filter(s=>s.u==="D"),"Delegação")+side(l.filter(s=>s.u==="F"),"Família & convidados")+
    `<p class="note">Mesmo formato da planilha Frota CAM: setor, veículo e responsável. Toque num veículo para ver os trechos.</p>`;
}

/* ---------- FUNÇÕES DO DIA ---------- */
const tasksDay=d=>T.filter(t=>t.d===d).sort((a,b)=>a.h.localeCompare(b.h));
function doneCount(list,person){let n=0,tot=0;list.forEach(t=>t.p.forEach(p=>{if(person&&p!==person)return;tot++;if(checks.has(ckey(t.id,p)))n++}));return [n,tot]}
function vFunc(){
  const l=tasksDay(st.day);
  const [n,tot]=doneCount(l);
  let h=dayHead(`${l.length} funções · ${n} de ${tot} marcadas`);
  h+=`<div class="people">${PEOPLE.map(p=>{const [a,b]=doneCount(l,p);return `<button class="person" data-goperson="${p}"><b>${p}</b><span class="count">${b?a+"/"+b:"—"}</span><div class="prog-bar"><div style="width:${b?Math.round(a/b*100):0}%"></div></div></button>`}).join("")}</div>`;
  if(canEdit())h+=`<div class="addrow"><button class="btn o sm" data-new="task">+ Nova função</button></div>`;
  h+=`<div class="card">${l.length?l.map(t=>`<div class="task"><div class="top"><span class="time">${t.h}</span>
     <span class="t"><b>${esc(nice(t.a))}</b><span class="sub">${esc(nice(t.op))} · ${esc(nice(t.loc))} · ${esc(nice(t.g))}</span>${t._ed?"<br>"+edInfo(t):""}</span>${ebtn("task",t.id)}</div>
     <div class="who">${t.p.map(p=>pchip(t,p)).join("")}</div></div>`).join(""):`<div class="empty">Sem funções neste dia.</div>`}</div>
   <p class="note">Toque no nome para marcar a função daquela pessoa como feita.</p>`;
  return h;
}
function pchip(t,p){const c=checks.get(ckey(t.id,p));return `<button class="pck ${c?"on":""}" data-ck="${t.id}" data-p="${p}" aria-pressed="${!!c}" title="${c?"Feito"+(c.at?" às "+hhmm(c.at):""):"Marcar como feito"}"><span class="bx">${c?"✓":""}</span>${p}</button>`}
function hhmm(iso){try{const d=new Date(iso);return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(_){return ""}}

/* ---------- POR PESSOA ---------- */
function vPess(){
  const p=st.person;
  let h=`<div class="people">${PEOPLE.map(x=>{const [a,b]=doneCount(st.allDays?T:tasksDay(st.day),x);
    return `<button class="person" aria-pressed="${x===p}" data-person="${x}"><b>${x}</b><span class="count">${b?a+"/"+b:"—"}</span><div class="prog-bar"><div style="width:${b?Math.round(a/b*100):0}%"></div></div></button>`}).join("")}</div>
  <div class="bar-row"><div class="seg" role="group" aria-label="Período"><button aria-pressed="${!st.allDays}" data-all="0">Dia selecionado</button><button aria-pressed="${st.allDays}" data-all="1">Viagem toda</button></div></div>`;
  const days=st.allDays?DAYS.map(d=>d.id):[st.day];
  days.forEach(d=>{
    const l=tasksDay(d).filter(t=>t.p.includes(p)), mac=(MACRO[p]||{})[d], D=dayOf(d);
    if(st.allDays&&!l.length&&!mac)return;
    const [a,b]=doneCount(l,p);
    h+=`<div class="dayhead"><div><h2>${p} · ${D.dd}</h2><p>${D.tit}${b?` · ${a} de ${b} feitas`:""}</p></div><span class="md">${D.md}</span></div>`;
    if(b)h+=`<div class="prog-bar"><div style="width:${Math.round(a/b*100)}%"></div></div>`;
    if(mac)h+=`<div class="macro"><span class="lbl">Responsabilidades do dia</span><ul>${mac.map(x=>`<li>${esc(nice(x))}</li>`).join("")}</ul></div>`;
    h+=`<div class="card">${l.length?l.map(t=>{const c=checks.get(ckey(t.id,p));const others=t.p.filter(x=>x!==p);
      return `<button class="chk ${c?"on":""}" data-ck="${t.id}" data-p="${p}" aria-pressed="${!!c}"><span class="box">${c?"✓":""}</span>
        <span class="t"><b>${esc(nice(t.a))}</b><span class="sub">${esc(nice(t.loc))}${others.length?" · com "+others.join(", "):""}</span>
        ${c?`<br><span class="done-by">Feito${c.at?" às "+hhmm(c.at):""}${c.by&&names[c.by]?" por "+esc(names[c.by]):""}</span>`:""}</span>
        <span class="time">${t.h}</span></button>`}).join(""):`<div class="empty">Sem funções no MICRO para ${p} neste dia.</div>`}</div>`;
  });
  if(st.allDays&&!T.some(t=>t.p.includes(p)))h+=`<div class="card"><div class="empty">Sem funções para ${p}.</div></div>`;
  return h;
}

/* ---------- PROGRAMAÇÃO ---------- */
function vProg(){
  const p=PROG[st.day]||[];
  let h=dayHead(p.length?`Programação prévia da delegação · ${p.length} atividades`:"");
  const add=canEdit()?`<div class="addrow"><button class="btn o sm" data-new="prog">+ Nova atividade</button></div>`:"";
  if(!p.length)return h+add+`<div class="card"><div class="empty">Sem programação da delegação neste dia. As funções da equipe estão em “Funções”.</div></div>`;
  h+=add;
  const dep=S.filter(s=>s.d===st.day&&s.u==="D");
  h+=`<div class="card">${p.map((x,i)=>{
    const nxt=p[i+1]?p[i+1][0]:"99:99";
    const v=dep.filter(s=>s.ini&&s.ini>=x[0]&&s.ini<nxt&&s.pax!=="BACKUP"&&/BUS/.test(s.v));
    return `<div class="prg ${x[3]?"key":""}" style="grid-template-columns:52px 1fr auto"><span class="time">${x[0]}</span><span><b>${esc(x[1])}</b> <span class="sub">· ${esc(x[2])}</span>
      ${v.length?`<div class="veh">🚌 ${v.map(s=>esc(veh(s.v))+" "+s.ini+" → "+esc(pl(s.legs[0]?s.legs[0].de:""))).join(" · ")}</div>`:""}${x[5]?"<br>"+edInfo({_ed:x[5],_new:x[4].startsWith("n")}):""}</span>${ebtn("prog",x[4])}</div>`}).join("")}</div>
  <p class="note">Fonte: Programação Prévia CAM (Sula 26 · CAM x BOC), com as edições feitas no app. Os ônibus da delegação aparecem embaixo da atividade em que saem.</p>`;
  return h;
}

/* ---------- MACRO ---------- */
const MDAYS=[{id:"pre",l:"Antes"},...DAYS.map(d=>({id:d.id,l:d.ds+" "+d.dd}))];
function vMacro(){
  const cell=(p,d)=>{const l=(MACRO[p]||{})[d];return l&&l.length?`<ul>${l.map(x=>`<li>${esc(nice(x.replace(/\/\//g,"/")))}</li>`).join("")}</ul>`:`<span class="sub">—</span>`};
  let h=`<div class="dayhead"><div><h2>Macro da equipe</h2><p>Responsabilidades de cada pessoa por dia. O dia selecionado aparece em destaque.</p></div></div>
  <div class="mx-wrap"><table class="mx"><thead><tr><th class="p">Pessoa</th>${MDAYS.map(d=>`<th class="${d.id===st.day?"sel":""}">${d.l}</th>`).join("")}</tr></thead>
  <tbody>${PEOPLE.map(p=>`<tr><th class="p"><button class="pbtn" data-goperson="${p}">${p}</button></th>${MDAYS.map(d=>`<td class="${d.id===st.day?"sel":""}">${cell(p,d.id)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="group">${dayOf(st.day).dd} · quem faz o quê</div>
  <div class="mcards">${PEOPLE.map(p=>{const l=(MACRO[p]||{})[st.day];const [a,b]=doneCount(tasksDay(st.day),p);
    return `<div class="macro"><div class="bar-row"><b>${p}</b><span class="sub">${b?a+" de "+b+" funções feitas":"sem funções no MICRO"}</span></div>
    ${l&&l.length?`<ul>${l.map(x=>`<li>${esc(nice(x.replace(/\/\//g,"/")))}</li>`).join("")}</ul>`:`<span class="sub">Sem responsabilidade no macro.</span>`}</div>`}).join("")}</div>`;
  return h;
}

/* ---------- mensagem WhatsApp ---------- */
const msgo={fam:false,legs:false};
function buildMsg(){
  const d=dayOf(st.day);
  const l=S.filter(s=>s.d===st.day&&(msgo.fam||s.u==="D")).sort((a,b)=>(a.ini||"99").localeCompare(b.ini||"99"));
  let m=`FROTA CAM\n\n${d.dd} (${d.ds})\n`;
  l.forEach(s=>{m+=`\n${s.ini||"--:--"} - ${emo(s.v)} ${veh(s.v)}${s.pax==="BACKUP"?" (backup)":""} | ${actLabel(s)}`;
    if(msgo.legs)s.legs.forEach(g=>m+=`\n   ↳ ${g.h?g.h+" ":""}${pl(g.o)} → ${pl(g.de)}`);m+="\n"});
  if(!l.length)m+="\nSem veículos programados.\n";
  return m.trim();
}
function openMsg(){
  const draw=()=>{const txt=buildMsg();
    $("#sheet").innerHTML=`<div role="dialog" aria-label="Mensagem da frota"><div class="shead"><h3>Mensagem da frota · ${dayOf(st.day).dd}</h3><button class="btn o sm" data-close>Fechar</button></div>
    <div class="opts"><label><input type="checkbox" id="o-fam" ${msgo.fam?"checked":""}> Família & convidados</label><label><input type="checkbox" id="o-legs" ${msgo.legs?"checked":""}> Trechos</label></div>
    <textarea class="wa-prev" id="msgtxt" aria-label="Texto da mensagem">${esc(txt)}</textarea>
    <div class="bar-row"><button class="btn" id="copy">Copiar texto</button><a class="btn wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Abrir no WhatsApp</a></div></div>`;
    $("#o-fam").onchange=e=>{msgo.fam=e.target.checked;draw()};$("#o-legs").onchange=e=>{msgo.legs=e.target.checked;draw()};
    $("#msgtxt").oninput=e=>{$("#wa").href="https://wa.me/?text="+encodeURIComponent(e.target.value)};
    $("#copy").onclick=()=>{const t=$("#msgtxt");const fb=()=>{t.focus();t.select();toast("Texto selecionado. Copie com Ctrl+C")};try{navigator.clipboard.writeText(t.value).then(()=>toast("Mensagem copiada"),fb)}catch(_){fb()}};
  };draw();$("#sheet").hidden=false;
}

/* ---------- EDITAR ---------- */
const PLACES=[...new Set(SBASE.flatMap(s=>s.legs.flatMap(g=>[g.o,g.de])).filter(Boolean))].sort();
let form=null;
const opt=(v,cur,l)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l??v)}</option>`;
const dayOpts=cur=>DAYS.map(d=>opt(d.id,cur,d.ds+" "+d.dd)).join("");
function findItem(kind,id){return kind==="svc"?S.find(x=>x.id===id):kind==="task"?T.find(x=>x.id===id):(()=>{for(const d in PROG){const x=PROG[d].find(r=>r[4]===id);if(x)return {id,d,h:x[0],n:x[1],loc:x[2],key:!!x[3],_ed:x[5]}}})()}
function isBase(kind,id){return (kind==="svc"?SBASE:kind==="task"?TBASE:PBASE).some(b=>b.id===id)}
function openEdit(kind,id){
  const x=id?findItem(kind,id):null;
  if(id&&!x){toast("Item não encontrado");return}
  form={kind,id,base:id?isBase(kind,id):false,del:false,
    legs:kind==="svc"?(x?x.legs.map(g=>({...g})):[{h:"",o:"HILTON GARDEN INN",de:""}]):null,
    x:x||(kind==="svc"?{d:st.day,n:"",v:"",act:"",u:"D",g:"",r:"",cap:"",pax:"",ini:"",fim:"",ped:"",conf:"-"}:kind==="task"?{d:st.day,h:"",a:"",loc:"",op:"",g:"",p:[]}:{d:st.day,h:"",n:"",loc:"",key:false})};
  drawEdit();$("#sheet").hidden=false;
}
function legRows(){return form.legs.map((g,i)=>`<div class="legrow"><input type="time" aria-label="Hora do trecho ${i+1}" data-leg="${i}" data-f="h" value="${esc(g.h)}"><input list="places" aria-label="Origem do trecho ${i+1}" data-leg="${i}" data-f="o" value="${esc(g.o)}" placeholder="Origem"><input list="places" aria-label="Destino do trecho ${i+1}" data-leg="${i}" data-f="de" value="${esc(g.de)}" placeholder="Destino"><button type="button" data-delleg="${i}" aria-label="Remover trecho ${i+1}">×</button></div>`).join("")}

    <label class="fld">Responsável<input id="f-r" value="${esc(x.r)}"></label>
    <label class="fld">Capacidade<input id="f-cap" value="${esc(x.cap)}"></label>

    <div class="fld full">Trechos<div id="legs" style="display:flex;flex-direction:column;gap:6px">${legRows()}</div>
      <button type="button" class="btn o sm" id="addleg" style="align-self:flex-start">+ Trecho</button></div>
    <datalist id="places">${PLACES.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>`;
  if(kind==="task")f=`<div class="fgrid">
    <label class="fld">Dia<select id="f-d">${dayOpts(x.d)}</select></label>
    <label class="fld">Hora<input id="f-h" type="time" value="${esc(x.h)}" required></label>

    <label class="fld">Local<input id="f-loc" value="${esc(x.loc)}"></label>
    <label class="fld">Operação<input id="f-op" value="${esc(x.op)}"></label>
    <label class="fld full">Grupo<input id="f-g" value="${esc(x.g)}"></label>
    <div class="fld full">Responsáveis<div class="pchecks">${[...new Set([...PEOPLE,...x.p])].map(p=>`<label><input type="checkbox" name="fp" value="${esc(p)}"${x.p.includes(p)?" checked":""}> ${esc(p)}</label>`).join("")}</div></div></div>`;
  if(kind==="prog")f=`<div class="fgrid">
    <label class="fld">Dia<select id="f-d">${dayOpts(x.d)}</select></label>
    <label class="fld">Hora<input id="f-h" type="time" value="${esc(x.h)}" required></label>
    <label class="fld full">Atividade<input id="f-n" value="${esc(x.n)}" required></label>
    <label class="fld">Local<input id="f-loc" value="${esc(x.loc)}"></label>
    <div class="fld">Destaque<div class="pchecks"><label><input type="checkbox" id="f-key"${x.key?" checked":""}> Marco do dia</label></div></div></div>`;
  $("#sheet").innerHTML=`<div role="dialog" aria-label="Editar ${title}"><form id="ef" novalidate style="display:flex;flex-direction:column;gap:14px">
    <div class="shead"><h3>${form.id?"Editar":"Novo"} ${title}</h3><button type="button" class="btn o sm" data-close>Cancelar</button></div>
    ${form.id&&x._ed?`<p class="sub" style="margin:0">${edInfo(x)}</p>`:""}
    ${f}
    <p class="sub" id="ferr" style="margin:0;color:#B3261E" hidden></p>
    <div class="factions"><div class="l">
      ${form.id?`<button type="button" class="btn danger sm" id="fdel">${form.del?"Confirmar exclusão":"Excluir"}</button>`:""}
      ${form.id&&form.base&&x._ed?`<button type="button" class="btn o sm" id="frest">Voltar ao original</button>`:""}</div>
      <button type="submit" class="btn">Salvar</button></div></form></div>`;
  wireEdit();
}
function readLegs(){document.querySelectorAll("#legs [data-leg]").forEach(i=>{form.legs[+i.dataset.leg][i.dataset.f]=i.value.trim()})}
function wireEdit(){
  const al=$("#addleg"); if(al)al.onclick=()=>{readLegs();keepFields();form.legs.push({h:"",o:"",de:""});drawEdit()};
  document.querySelectorAll("[data-delleg]").forEach(b=>b.onclick=()=>{readLegs();keepFields();form.legs.splice(+b.dataset.delleg,1);drawEdit()});
  const del=$("#fdel"); if(del)del.onclick=()=>{if(!form.del){keepFields();form.del=true;drawEdit();return}saveEdit(form.kind,form.id,null,true)};
  const rs=$("#frest"); if(rs)rs.onclick=()=>restoreEdit(form.id);
  $("#ef").addEventListener("submit",e=>{e.preventDefault();const d=collect();if(!d)return;saveEdit(form.kind,form.id,d,false)});
}
const val=id=>{const e=$(id);return e?e.value.trim():""};
function keepFields(){const d=collect(true);if(d)form.x={...form.x,...d}}
function collect(quiet){
  const k=form.kind, err=m=>{if(quiet)return null;const e=$("#ferr");e.textContent=m;e.hidden=false;return null};
  if(k==="svc"){readLegs();
    const d={d:val("#f-d"),n:val("#f-n"),v:val("#f-v").toUpperCase(),act:val("#f-act").split("\n").map(t=>t.trim()).filter(Boolean).join(" | "),u:val("#f-u"),
      g:val("#f-g").toUpperCase(),r:val("#f-r").toUpperCase(),cap:val("#f-cap"),pax:val("#f-pax").toUpperCase(),ini:val("#f-ini"),fim:val("#f-fim"),ped:val("#f-ped"),conf:val("#f-conf"),
      obs:form.x.obs||"",legs:form.legs.filter(g=>g.h||g.o||g.de).map(g=>({...g,o:(g.o||"").toUpperCase(),de:(g.de||"").toUpperCase()}))};
    if(!d.v&&!quiet)return err("Informe o veículo.");
    if(!d.legs.length&&!quiet)return err("Inclua pelo menos um trecho.");
    if(!d.legs.length)d.legs=form.legs;
    return d}
  if(k==="task"){
    const d={d:val("#f-d"),h:val("#f-h"),a:val("#f-a").toUpperCase(),loc:val("#f-loc").toUpperCase(),op:val("#f-op").toUpperCase(),g:val("#f-g").toUpperCase(),
      p:[...document.querySelectorAll('input[name="fp"]:checked')].map(i=>i.value)};
    if(!quiet){if(!d.h)return err("Informe a hora.");if(!d.a)return err("Informe a função.");if(!d.p.length)return err("Marque pelo menos um responsável.")}
    return d}
  const d={d:val("#f-d"),h:val("#f-h"),n:val("#f-n"),loc:val("#f-loc"),key:!!($("#f-key")&&$("#f-key").checked)};
  if(!quiet){if(!d.h)return err("Informe a hora.");if(!d.n)return err("Informe a atividade.")}
  return d}
const newId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function saveEdit(kind,id,data,deleted){
  if(!canEdit()){toast("Sem permissão para editar");return}
  const isNew=!id; if(isNew)id=newId();
  const base=isBase(kind,id);
  if(deleted&&!base){return removeEdit(id,"Excluído")}
  const doc={kind,base,data:deleted?null:data,deleted:!!deleted,at:new Date().toISOString(),by:myId||null};
  const prev=edits.get(id); edits.set(id,doc); applyEdits();
  $("#sheet").hidden=true; if(data&&data.d)st.day=data.d; render();
  if(mode!=="db"){saveLocalEdits();toast(deleted?"Excluído":"Salvo");return}
  try{await dbRef.collection("edits").doc(id).set(doc);toast(deleted?"Excluído":"Salvo")}
  catch(e){if(prev)edits.set(id,prev);else edits.delete(id);applyEdits();render();
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("Sem permissão para editar")}else toast("Não foi possível salvar. Tente de novo.")}
}
async function removeEdit(id,msg){
  const prev=edits.get(id); edits.delete(id); applyEdits(); $("#sheet").hidden=true; render();
  if(mode!=="db"){saveLocalEdits();toast(msg);return}
  try{await dbRef.collection("edits").doc(id).delete();toast(msg)}
  catch(e){if(prev)edits.set(id,prev);applyEdits();render();toast("Não foi possível salvar. Tente de novo.")}
}
const restoreEdit=id=>removeEdit(id,"Voltou ao original da planilha");
function saveLocalEdits(){ls.set("op-edits",JSON.stringify([...edits]))}
function loadLocalEdits(){try{const a=JSON.parse(ls.get("op-edits")||"[]");edits.clear();a.forEach(([k,v])=>edits.set(k,v))}catch(_){}applyEdits()}

/* ---------- render ---------- */
function render(){
  renderHead();
  $("#view").innerHTML=(mode==="local"?`<div class="banner">As marcações e edições estão sendo salvas só neste aparelho. A equipe não vê o que você mudar aqui.</div>`:"")+
    (readOnly?`<div class="banner">Você pode ver tudo, mas não marcar nem editar. Peça acesso de Editor ao Guilherme.</div>`:"")+
    (st.tab==="transp"?vTransp():st.tab==="prog"?vProg():st.tab==="func"?vFunc():st.tab==="macro"?vMacro():vPess());
  if(st.openV){const el=document.getElementById("veh-"+st.openV);if(el){el.scrollIntoView({block:"center"});st.openV=null}}
}

/* ---------- marcação ---------- */
const busy=new Set();
async function toggle(tid,p){
  if(readOnly){toast("Sem permissão para marcar");return}
  const k=ckey(tid,p); if(busy.has(k))return;
  const was=checks.get(k);
  if(was)checks.delete(k);else checks.set(k,{at:new Date().toISOString(),by:myId});
  render();
  if(mode!=="db"){saveLocal();return}
  busy.add(k);
  try{
    const ref=dbRef.collection("checks").doc(k);
    if(was)await ref.delete();else await ref.set({task:tid,person:p,at:new Date().toISOString(),by:myId||null});
  }catch(e){
    if(was)checks.set(k,was);else checks.delete(k);
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("Sem permissão para marcar")}
    else if(e&&e.code==="quota_exceeded")toast("Armazenamento cheio. Avise o Guilherme.");
    else toast("Não foi possível salvar. Tente de novo.");
    render();
  }finally{busy.delete(k)}
}
function saveLocal(){ls.set("op-checks",JSON.stringify([...checks]))}
function loadLocal(){try{const a=JSON.parse(ls.get("op-checks")||"[]");checks.clear();a.forEach(([k,v])=>checks.set(k,v))}catch(_){}}

let myId=null;
async function resolveNames(){
  if(!userNS)return;
  const ids=[...new Set([...checks.values(),...edits.values()].map(c=>c.by).filter(Boolean))];
  if(!ids.length)return;
  const ps=await userNS.profiles(ids); let ch=false;
  ids.forEach(id=>{const n=ps[id]&&ps[id].name||"";if(names[id]!==n){names[id]=n;ch=true}});
  if(ch)render();
}
async function boot(){
  render();
  const fallback=()=>{if(mode==="loading"){mode="local";loadLocal();loadLocalEdits();render()}};
  const timer=setTimeout(fallback,10000);
  let db=null;
  for(let i=0;i<50&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
  try{ if(window.claude&&window.claude.use){ [db,userNS]=await Promise.all([window.claude.use("db"),window.claude.use("user")]) } }catch(_){}
  if(!db){clearTimeout(timer);fallback();return}
  dbRef=db;
  try{myId=userNS?await userNS.id():null;const w=userNS?await userNS.can("data.write"):null;if(w===false)readOnly=true}catch(_){}
  db.collection("checks").onSnapshot(snap=>{
    clearTimeout(timer); mode="db";
    checks.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v)checks.set(d.id,{at:v.at,by:v.by})});
    render(); resolveNames();
  },err=>{clearTimeout(timer);if(mode!=="db"){mode="local";loadLocal();loadLocalEdits()}render()});
  db.collection("edits").onSnapshot(snap=>{
    edits.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.kind)edits.set(d.id,v)});
    applyEdits(); if($("#sheet").hidden)render(); resolveNames();
  },()=>{});
}

document.addEventListener("click",e=>{
  const g=k=>e.target.closest(`[${k}]`);let el;
  if(el=g("data-d")){st.day=el.dataset.d;render();window.scrollTo(0,0)}
  else if(el=g("data-t")){st.tab=el.dataset.t;render();window.scrollTo(0,0)}
  else if(el=g("data-tv")){st.tv=el.dataset.tv;render()}
  else if(el=g("data-who")){st.who=el.dataset.who;render()}
  else if(g("data-prog")){st.prog=!st.prog;render()}
  else if(el=g("data-goveh")){st.tv="veh";st.who="all";st.openV=el.dataset.goveh;render()}
  else if(el=g("data-ck")){toggle(el.dataset.ck,el.dataset.p)}
  else if(el=g("data-person")){st.person=el.dataset.person;ls.set("op-person",st.person);render()}
  else if(el=g("data-goperson")){st.person=el.dataset.goperson;ls.set("op-person",st.person);st.tab="pess";render();window.scrollTo(0,0)}
  else if(el=g("data-all")){st.allDays=el.dataset.all==="1";render()}
  else if(el=g("data-edit")){openEdit(el.dataset.edit,el.dataset.id)}
  else if(el=g("data-new")){openEdit(el.dataset.new,null)}
  else if(g("data-msg")){openMsg()}
  else if(g("data-close")||e.target.id==="sheet"){$("#sheet").hidden=true;render()}
});
boot();
</script>

</body></html>
