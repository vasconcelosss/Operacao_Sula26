<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
/* ---------- operação CNF ---------- */
.cnf-intro{margin:14px 0;color:var(--muted);font-size:13px}
.cnf-section{margin:16px 0 22px}
.cnf-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 9px}
.cnf-section-head h2{font:700 22px var(--f-disp);letter-spacing:.04em;margin:0}
.cnf-count{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.cnf-progress{height:6px;background:var(--sunk);border-radius:8px;overflow:hidden;margin:0 0 10px}
.cnf-progress>span{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .2s}
.cnf-list{display:grid;gap:6px}
.cnf-person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font:500 14px var(--f-body);cursor:pointer;min-height:46px}
.cnf-person[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok)}
.cnf-box{width:21px;height:21px;flex:0 0 21px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:white}
.cnf-person[aria-pressed=true] .cnf-box{background:var(--ok);border-color:var(--ok)}
.cnf-person[aria-pressed=true] .cnf-name{text-decoration:line-through;text-decoration-color:var(--ok);opacity:.8}
.cnf-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.cnf-tools .btn{font-size:12px}
.cnf-subtabs{display:flex;gap:8px;margin:14px 0 16px;padding:4px;background:var(--sunk);border-radius:12px}
.cnf-subtab{flex:1;border:0;border-radius:9px;padding:11px 12px;background:transparent;color:var(--muted);font:600 13px var(--f-body);cursor:pointer}
.cnf-subtab.active{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px #00000012}
.cnf-add{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cnf-add input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--fg);font:14px var(--f-body)}
.cnf-person-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cnf-person-line{display:flex;align-items:stretch;gap:6px;padding:0 6px 0 0}
.cnf-person-wrap .cnf-person{border:0;border-radius:0;flex:1;min-width:0}
.cnf-note-toggle{align-self:center;flex:0 0 32px;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);font:600 20px var(--f-body);cursor:pointer;display:grid;place-items:center}
.cnf-note-toggle.has-note{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.cnf-observation{display:flex;gap:7px;padding:0 10px 10px 43px}
.cnf-observation input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;color:var(--fg);font:12px var(--f-body)}
.cnf-observation button{border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:7px;padding:7px 10px;font:600 11px var(--f-body);cursor:pointer}
.cnf-note-saved{font-size:11px;color:var(--muted);padding:0 10px 8px 43px}
.cnf-search{width:100%;margin:10px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--fg);font:14px var(--f-body)}
.cnf-empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
</style></head><body><title>Operação Final Sula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de celular — barra escura fixa (dias + abas), conteúdo em listas e cards; checklist com marcação compartilhada */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --sunk:#ECEBE5; --fg:#16150F; --muted:#6B6858; --line:#E2E0D6;
  --head:#111110; --head-fg:#F5F3EA; --head-mut:#ADA996; --gold:#C9A227; --gold-ink:#7A5F0A; --gold-soft:#F6EDCC;
  --ok:#1F7A4D; --ok-soft:#DDF1E5; --warn:#A55A00; --warn-soft:#FBE8CF; --info:#2F5D8A; --info-soft:#E1EAF4; --bad:#B3261E; --bad-soft:#FBE1DE;
  --wa:#1E8E4E; --wa-bg:#E7F3EC;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121210; --surface:#1C1B18; --sunk:#171714; --fg:#EEECE3; --muted:#A39F8C; --line:#2E2D28;
  --head:#000000; --head-fg:#F5F3EA; --head-mut:#A8A493; --gold:#D9B23A; --gold-ink:#E6C766; --gold-soft:#3A3218;
  --ok:#6FCF97; --ok-soft:#1C3328; --warn:#F2B25C; --warn-soft:#3B2B14; --info:#8AB4E0; --info-soft:#1B2836; --bad:#FF8A80; --bad-soft:#3A1A18;
  --wa:#2FA864; --wa-bg:#16261D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121210; --surface:#1C1B18; --sunk:#171714; --fg:#EEECE3; --muted:#A39F8C; --line:#2E2D28;
  --head:#000000; --head-fg:#F5F3EA; --head-mut:#A8A493; --gold:#D9B23A; --gold-ink:#E6C766; --gold-soft:#3A3218;
  --ok:#6FCF97; --ok-soft:#1C3328; --warn:#F2B25C; --warn-soft:#3B2B14; --info:#8AB4E0; --info-soft:#1B2836; --bad:#FF8A80; --bad-soft:#3A1A18;
  --wa:#2FA864; --wa-bg:#16261D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-fg)}
header .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.trip{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.trip h1{font-family:var(--f-disp);font-size:23px;letter-spacing:.03em;margin:0;line-height:1}
.trip small{display:block;color:var(--head-mut);font-size:12.5px;margin-top:4px}
.sync{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;font-weight:600;white-space:nowrap;background:#2a2a26;color:#cfcab6}
.sync.on{background:var(--gold);color:#111}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.day{font:600 12.5px var(--f-body);border:1px solid #34332e;background:#1d1d1b;color:#D8D4C4;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.day small{font-size:10.5px;color:#8f8b7c;font-weight:500;letter-spacing:.04em}
.day[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold)}
.day[aria-pressed="true"] small{color:#3b300a}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{flex:1 0 auto;font-family:var(--f-disp);font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:#9C998A;padding:9px 4px 8px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--head-fg);border-bottom-color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main .wrap{padding-block:14px 56px;display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dayhead h2{font-family:var(--f-disp);font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.05}
.dayhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.md{font-family:var(--f-mono);font-size:11.5px;color:var(--gold-ink);background:var(--gold-soft);padding:2px 6px;border-radius:4px}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{font:600 13.5px var(--f-body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{font:600 14px var(--f-body);background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{font-family:var(--f-disp);font-size:24px;line-height:1.05;display:block;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group{font-family:var(--f-disp);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.time{font-family:var(--f-mono);font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.time.na{color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-gold{background:var(--gold-soft);color:var(--gold-ink)} .p-info{background:var(--info-soft);color:var(--info)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-ped{background:var(--sunk);color:var(--fg);font-family:var(--f-mono);letter-spacing:0}
.lgrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.lgrow .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.lgb{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.lgb[aria-pressed="true"]{background:var(--head);color:var(--head-fg);border-color:var(--head)}
.linkb{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.vnote{margin:0 14px 12px;padding:9px 11px;border-radius:8px;background:var(--gold-soft);color:var(--fg);font-size:13.5px;white-space:pre-wrap;border-left:3px solid var(--gold)}
.vnote .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:2px}
.vnote .edby{display:block;margin-top:4px}
.nbtn{font:600 13px var(--f-body);border:1px dashed var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
.lgb:disabled{cursor:default;opacity:.55}
.who-lg{font-weight:600;color:var(--gold-ink)}
.stat.bad b{color:var(--bad)}
.chips .sep{width:1px;background:var(--line);margin:2px 2px}
/* timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:50px 24px 1fr;gap:0 6px;padding:9px 14px;border-top:1px solid var(--line);align-items:start;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.tl-i:first-child{border-top:0}
.tl-i .ic{font-size:15px;text-align:center;line-height:1.35}
.tl-i .t{min-width:0}
.tl-i.prog{background:var(--sunk)}
.tl-i.prog b{font-weight:600}
.tl-i.key b{color:var(--gold-ink)}
.tl-i.veh{cursor:pointer}
.tl-i.veh:hover{background:var(--sunk)}
.route{font-size:14px}
/* vehicle card */
.vh{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.vh .t{flex:1;min-width:0}
.vh b{font-weight:600}
.vh .pills{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.legs{border-top:1px solid var(--line);padding:8px 14px 10px;display:flex;flex-direction:column}
.leg{display:grid;grid-template-columns:48px 14px 1fr;gap:0 8px;align-items:start;padding:4px 0}
.leg .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);margin-top:5px;justify-self:center}
.leg .t{min-width:0}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);padding:0 14px 12px}
.kv span b{color:var(--fg);font-weight:600}
/* tasks */
.task{display:flex;flex-direction:column;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .top{display:flex;gap:10px;align-items:flex-start}
.task .t{flex:1;min-width:0}
.task .t b{font-weight:600;display:block}
.who{display:flex;gap:6px;flex-wrap:wrap;padding-left:58px}
.pck{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px 4px 5px;cursor:pointer}
.pck .bx{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.pck.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pck.on .bx{background:var(--ok);border-color:var(--ok)}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left}
.chk:first-child{border-top:0}
.chk .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .t b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.chk .t{flex:1;min-width:0}
.chk .t b{font-weight:600;display:block}
.done-by{font-size:12px;color:var(--ok)}
.prog-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog-bar>div{height:100%;background:var(--ok);transition:width .2s}
.people{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.person[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.person b{font-weight:600;font-size:14px}
.person .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.macro ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:0}
.banner{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-disp);font-size:21px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.wa-prev{background:var(--wa-bg);border-radius:10px;padding:12px;font-family:var(--f-body);font-size:14px;line-height:1.45;border:1px solid var(--line);width:100%;min-height:300px;color:var(--fg);resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:30}
.prg{display:grid;grid-template-columns:52px 1fr;gap:0 10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.prg:first-child{border-top:0}
.prg b{font-weight:600}
.prg.key{background:var(--gold-soft)}
.prg.key b{color:var(--gold-ink)}
.prg .veh{font-size:13px;color:var(--muted);margin-top:3px}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:860px;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.mx thead th{font-family:var(--f-disp);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
.mx thead th.sel{color:var(--gold-ink);background:var(--gold-soft)}
.mx td.sel{background:color-mix(in srgb,var(--gold-soft) 45%,var(--surface))}
.mx th.p{position:sticky;left:0;background:var(--surface);z-index:1;min-width:92px}
.mx thead th.p{background:var(--sunk)}
.mx ul{margin:0;padding-left:15px;display:flex;flex-direction:column;gap:2px}
.mx .pbtn{font:600 14px var(--f-body);background:none;border:0;color:var(--fg);padding:0;cursor:pointer;text-align:left}
.mx .pbtn:hover{color:var(--gold-ink)}
.mcards{display:flex;flex-direction:column;gap:8px}
.fr-h{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;background:var(--head);color:var(--head-fg)}
.fr-h b{font-family:var(--f-disp);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.fr-h .sub{color:var(--head-mut)}
.fr-set{display:flex;flex-direction:column;border-top:1px solid var(--line);padding:8px 0 4px}
.fr-set:first-of-type{border-top:0}
.fr-set .lbl{padding:0 14px 4px;color:var(--gold-ink)}
.fr-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:7px 14px;background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.fr-row:hover{background:var(--sunk)}
.fr-row .t{min-width:0}
.fr-row b{font-weight:600}
.fr-r{font-weight:600;font-size:13.5px;text-align:right}
.ebtn{font:600 12.5px var(--f-body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.ebtn:hover{color:var(--fg);border-color:var(--muted)}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.edby{font-size:12px;color:var(--info)}
.addrow{display:flex;justify-content:flex-end}

function renderHead(){

  $("#days").innerHTML=DAYS.map(d=>`<button class="day" aria-pressed="${d.id===st.day}" data-d="${d.id}">${d.ds} ${d.dd}<small>${d.md}</small></button>`).join("");
  $("#tabs").innerHTML=[["transp","Transporte"],["prog","Programação"],["func","Funções"],["pess","Por pessoa"],["macro","Macro"],["cnf","Operação CNF"]]
    .map(([k,l])=>`<button role="tab" aria-selected="${k===st.tab}" data-t="${k}">${l}</button>`).join("");

function dayHead(extra){
  const d=dayOf(st.day);
  return `<div class="dayhead"><div><h2>${d.dd} · ${d.tit}</h2>${extra?`<p>${extra}</p>`:""}</div><span class="md">${d.md}</span></div>`;
}

function svcDay(){return S.filter(s=>s.d===st.day&&(st.who==="all"||s.u===st.who)&&(!st.lg||(st.lg==="-"?!lgOf(s):lgOf(s)===st.lg)))}
function vTransp(){
  const all=S.filter(s=>s.d===st.day), l=svcDay();
  const legs=all.reduce((n,s)=>n+s.legs.length,0);
  let h=dayHead(all.length?`${all.length} veículos · ${legs} trechos`:"");
  if(!all.length) return h+`<div class="card"><div class="empty">Sem transporte em Barranquilla neste dia. As tarefas do dia estão em “Funções”.</div></div>`+(canEdit()?`<div class="addrow"><button class="btn o sm" data-new="svc">+ Novo veículo</button></div>`:"");
  h+=`<div class="stats">
    <div class="stat"><span class="lbl">Veículos</span><b>${all.length}</b></div>
    <div class="stat"><span class="lbl">Delegação</span><b>${all.filter(s=>s.u==="D").length}</b></div>
    <div class="stat"><span class="lbl">Família & conv.</span><b>${all.filter(s=>s.u==="F").length}</b></div>
    <div class="stat"><span class="lbl">Ônibus</span><b>${all.filter(s=>/BUS/.test(s.v)).length}</b></div>
    <div class="stat ${all.some(s=>!String(s.ped||"").trim())?"bad":""}"><span class="lbl">Sem pedido</span><b>${all.filter(s=>!String(s.ped||"").trim()).length}</b></div></div>
  <div class="bar-row"><div class="seg" role="group" aria-label="Visualização">
    <button aria-pressed="${st.tv==="tl"}" data-tv="tl">Timeline</button><button aria-pressed="${st.tv==="veh"}" data-tv="veh">Por veículo</button><button aria-pressed="${st.tv==="frota"}" data-tv="frota">Frota CAM</button></div>

  <div class="chips" aria-label="Responsável da Logística"><button class="chip" aria-pressed="${!st.lg}" data-lg="">Logística: todos</button>${LOG.map(p=>`<button class="chip" aria-pressed="${st.lg===p}" data-lg="${p}">${p} · ${all.filter(s=>lgOf(s)===p).length}</button>`).join("")}<button class="chip" aria-pressed="${st.lg==="-"}" data-lg="-">Sem atribuição · ${all.filter(s=>!lgOf(s)).length}</button></div>`;
  return h+(st.tv==="tl"?timeline(l):st.tv==="frota"?frota(l):vehicles(l));
}
function timeline(l){
  const items=[];
  l.forEach(s=>{let last=s.ini||"";s.legs.forEach((g,i)=>{if(g.h)last=g.h;items.push({k:(last||"99:99")+(g.h?"0":"1")+String(i).padStart(2,"0"),t:"v",s,g,i})})});
  if(st.prog&&PROG[st.day])PROG[st.day].forEach(p=>items.push({k:(p[0]<"05:00"?"z":"")+p[0]+"/",t:"p",p}));
  items.sort((a,b)=>a.k.localeCompare(b.k));
  return `<div class="card tl">${items.map(it=>{
    if(it.t==="p"){const p=it.p;return `<div class="tl-i prog ${p[3]?"key":""}"><span class="time">${p[0]}</span><span class="ic">▪</span><span class="t"><b>${esc(p[1])}</b> <span class="sub">· ${esc(p[2])}</span></span></div>`}
    const {s,g,i}=it, r=g.r||s.r, gr=g.g||s.g;
    return `<button class="tl-i veh" data-goveh="${s.id}"><span class="time ${g.h?"":"na"}">${g.h||"—"}</span><span class="ic">${emo(s.v)}</span>
      <span class="t"><b>${esc(veh(s.v))}</b>${s.pax==="BACKUP"?' <span class="pill p-gold">backup</span>':""}${s._ed?' <span class="pill p-info">'+(s._new?"novo":"editado")+'</span>':""} <span class="sub">· ${esc(grp(gr))}</span>${i===0?" "+pedTag(s):""}
      <div class="route">${esc(pl(g.o))} → ${esc(pl(g.de))}</div>
      <span class="sub">${i>0?"trecho "+(i+1)+" · ":""}${esc(nice(r||"sem responsável"))}${lgOf(s)?' · Log. <span class="who-lg">'+esc(lgOf(s))+'</span>':""}${g.obs?" · "+esc(g.obs):""}${i===0&&noteOf(s)?'<br><span class="sub">📝 '+esc(noteOf(s).length>90?noteOf(s).slice(0,90)+"…":noteOf(s))+'</span>':""}</span></span></button>`}).join("")}</div>
  <p class="note">Horários da planilha de transporte. “—” é trecho sem horário fixo (volta ou disposição).</p>`;
}
function vehicles(l){
  const D=l.filter(s=>s.u==="D"),F=l.filter(s=>s.u==="F");
  const card=s=>`<div class="card" id="veh-${s.id}"${st.openV===s.id?' style="border-color:var(--gold)"':""}>
    <div class="vh"><span class="time ${s.ini?"":"na"}">${s.ini||"--:--"}</span>
      <span class="t"><b>${emo(s.v)} ${esc(veh(s.v))}</b><br><span class="sub">${esc(actLabel(s))}</span></span>
      <span class="pills"><span class="pill p-gold">nº ${esc(s.n)}</span>${pedTag(s)}${/^(confirmado|ok)$/i.test(String(s.conf||"").trim())?'<span class="pill p-ok">Confirmado</span>':""}</span></div>
    <div class="kv"><span>Grupo <b>${esc(grp(s.g)||"—")}</b></span><span>Resp. <b>${esc(nice(s.r||"—"))}</b></span>
      <span>Cap. <b>${esc(s.cap||"—")}</b>${s.pax&&s.pax!=="-"?` · <b>${esc(s.pax==="BACKUP"?"backup":s.pax+" pax")}</b>`:""}</span>
      <span>Disposição <b class="mono">${s.ini?s.ini+"–"+s.fim:"—"}</b></span></div>
    <div class="lgrow"><span class="lbl">Logística</span>${LOG.map(p=>`<button class="lgb" data-as="${s.id}" data-p="${p}" aria-pressed="${lgOf(s)===p}"${canEdit()?"":" disabled"}>${p}</button>`).join("")}${canEdit()?`<button class="nbtn" data-note="${s.id}">📝 ${noteOf(s)?"Editar observação":"Observação"}</button>`:""}</div>
    ${noteOf(s)?`<div class="vnote"><span class="lbl">Observação</span>${esc(noteOf(s))}${(()=>{const n=notes.get(s.id);if(!n)return "";const who=n.by&&names[n.by]?" por "+esc(names[n.by]):"";return n.at?`<span class="edby">Atualizada${" às "+hhmm(n.at)}${who}</span>`:""})()}</div>`:""}
    <div class="legs">${s.legs.map(g=>`<div class="leg"><span class="time ${g.h?"":"na"}" style="font-size:13.5px">${g.h||"—"}</span><span class="dot"></span>
      <span class="t">${esc(pl(g.o))} → ${esc(pl(g.de))}${g.g||g.r?`<br><span class="sub">${esc([g.g?grp(g.g):"",g.r?nice(g.r):""].filter(Boolean).join(" · "))}</span>`:""}${g.obs?`<br><span class="sub">${esc(g.obs)}</span>`:""}</span></div>`).join("")}</div>
    ${s._ed||canEdit()?`<div class="vfoot">${edInfo(s)||"<span></span>"}${ebtn("svc",s.id)}</div>`:""}</div>`;
  return (canEdit()?`<div class="addrow"><button class="btn o sm" data-new="svc">+ Novo veículo</button></div>`:"")+(D.length?`<div class="group">Delegação · ${D.length}</div>${D.map(card).join("")}`:"")+(F.length?`<div class="group">Família & convidados · ${F.length}</div>${F.map(card).join("")}`:"");
}

/* ---------- FROTA CAM (setor / veículo / responsável) ---------- */
function setor(s){const v=s.v.toUpperCase(),g=s.g.toUpperCase();
  if(/CAMI|CARGA/.test(v))return "Bagagens";
  if(["MKT","ANTIDOPING","AVANÇADA","DOPING","AVANZADA","DIRECTIVO","GALO DOIDO","INSTITUTO GALO","INSITUTO GALO"].includes(g)||/SUV/.test(v)||(/SEDAN/.test(v)&&!/FAM/.test(g))||/^BACKUP/.test(s.act))return "Apoio";
  return "Passageiros"}
function frota(l){
  const side=(list,name)=>{
    const body=["Bagagens","Passageiros","Apoio"].map(se=>{const x=list.filter(s=>setor(s)===se);if(!x.length)return "";
      return `<div class="fr-set"><span class="lbl">${se} · ${x.length}</span>${x.map(s=>`<button class="fr-row" data-goveh="${s.id}">
        <span class="time ${s.ini?"":"na"}">${s.ini||"--:--"}</span><span class="t">${emo(s.v)} <b>${esc(veh(s.v))}</b>${s.pax==="BACKUP"?' <span class="pill p-gold">backup</span>':""}
        ${["","PLANTEL","DELEGAÇÃO","DELEGACIÓN","FAMILIARES"].includes(s.g.toUpperCase())?"":`<span class="sub">· ${esc(grp(s.g))}</span>`}</span>
        <span class="fr-r">${esc(nice(s.r&&s.r!=="-"?s.r:"—"))}${lgOf(s)?`<br><span class="sub">Log. ${esc(lgOf(s))}</span>`:""}${String(s.ped||"").trim()?"":'<br><span class="pill p-bad">SEM PEDIDO</span>'}</span></button>`).join("")}</div>`}).join("");
    return `<div class="card fr"><div class="fr-h"><b>${name}</b><span class="sub">${list.length} veículo${list.length===1?"":"s"}</span></div>${body||`<div class="empty">Sem veículos.</div>`}</div>`};
  return side(l.filter(s=>s.u==="D"),"Delegação")+side(l.filter(s=>s.u==="F"),"Família & convidados")+
    `<p class="note">Mesmo formato da planilha Frota CAM: setor, veículo e responsável. Toque num veículo para ver os trechos.</p>`;
}

/* ---------- FUNÇÕES DO DIA ---------- */
const tasksDay=d=>T.filter(t=>t.d===d).sort((a,b)=>a.h.localeCompare(b.h));
function doneCount(list,person){let n=0,tot=0;list.forEach(t=>t.p.forEach(p=>{if(person&&p!==person)return;tot++;if(checks.has(ckey(t.id,p)))n++}));return [n,tot]}
function vFunc(){
  const l=tasksDay(st.day);
  const [n,tot]=doneCount(l);
  let h=dayHead(`${l.length} funções · ${n} de ${tot} marcadas`);
  h+=`<div class="people">${PEOPLE.map(p=>{const [a,b]=doneCount(l,p);return `<button class="person" data-goperson="${p}"><b>${p}</b><span class="count">${b?a+"/"+b:"—"}</span><div class="prog-bar"><div style="width:${b?Math.round(a/b*100):0}%"></div></div></button>`}).join("")}</div>`;
  if(canEdit())h+=`<div class="addrow"><button class="btn o sm" data-new="task">+ Nova função</button></div>`;
  h+=`<div class="card">${l.length?l.map(t=>`<div class="task"><div class="top"><span class="time">${t.h}</span>
     <span class="t"><b>${esc(nice(t.a))}</b><span class="sub">${esc(nice(t.op))} · ${esc(nice(t.loc))} · ${esc(nice(t.g))}</span>${t._ed?"<br>"+edInfo(t):""}</span>${ebtn("task",t.id)}</div>
     <div class="who">${t.p.map(p=>pchip(t,p)).join("")}</div></div>`).join(""):`<div class="empty">Sem funções neste dia.</div>`}</div>
   <p class="note">Toque no nome para marcar a função daquela pessoa como feita.</p>`;
  return h;
}
function pchip(t,p){const c=checks.get(ckey(t.id,p));return `<button class="pck ${c?"on":""}" data-ck="${t.id}" data-p="${p}" aria-pressed="${!!c}" title="${c?"Feito"+(c.at?" às "+hhmm(c.at):""):"Marcar como feito"}"><span class="bx">${c?"✓":""}</span>${p}</button>`}
function hhmm(iso){try{const d=new Date(iso);return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(_){return ""}}

/* ---------- POR PESSOA ---------- */
function vPess(){
  const p=st.person;
  let h=`<div class="people">${PEOPLE.map(x=>{const [a,b]=doneCount(st.allDays?T:tasksDay(st.day),x);
    return `<button class="person" aria-pressed="${x===p}" data-person="${x}"><b>${x}</b><span class="count">${b?a+"/"+b:"—"}</span><div class="prog-bar"><div style="width:${b?Math.round(a/b*100):0}%"></div></div></button>`}).join("")}</div>
  <div class="bar-row"><div class="seg" role="group" aria-label="Período"><button aria-pressed="${!st.allDays}" data-all="0">Dia selecionado</button><button aria-pressed="${st.allDays}" data-all="1">Viagem toda</button></div>
  <button class="btn sm" data-pdf>📄 PDF da missão · ${p}</button></div>`;
  const days=st.allDays?DAYS.map(d=>d.id):[st.day];
  days.forEach(d=>{
    const l=tasksDay(d).filter(t=>t.p.includes(p)), mac=(MACRO[p]||{})[d], D=dayOf(d);
    if(st.allDays&&!l.length&&!mac&&!(LOG.includes(p)&&S.some(s=>s.d===d&&lgOf(s)===p)))return;
    const [a,b]=doneCount(l,p);
    h+=`<div class="dayhead"><div><h2>${p} · ${D.dd}</h2><p>${D.tit}${b?` · ${a} de ${b} feitas`:""}</p></div><span class="md">${D.md}</span></div>`;
    if(b)h+=`<div class="prog-bar"><div style="width:${Math.round(a/b*100)}%"></div></div>`;
    const vs=LOG.includes(p)?S.filter(s=>s.d===d&&lgOf(s)===p).sort((a,b)=>(a.ini||"99").localeCompare(b.ini||"99")):[];
    if(vs.length)h+=`<div class="macro"><span class="lbl">Veículos sob sua responsabilidade · ${vs.length}</span><ul>${vs.map(s=>`<li><button class="linkb" data-goveh="${s.id}" data-d2="${s.d}">${s.ini||"--:--"} · ${emo(s.v)} ${esc(veh(s.v))} · ${esc(grp(s.g))}</button> ${pedTag(s)}</li>`).join("")}</ul></div>`;
    if(mac)h+=`<div class="macro"><span class="lbl">Responsabilidades do dia</span><ul>${mac.map(x=>`<li>${esc(nice(x))}</li>`).join("")}</ul></div>`;
    h+=`<div class="card">${l.length?l.map(t=>{const c=checks.get(ckey(t.id,p));const others=t.p.filter(x=>x!==p);
      return `<button class="chk ${c?"on":""}" data-ck="${t.id}" data-p="${p}" aria-pressed="${!!c}"><span class="box">${c?"✓":""}</span>
        <span class="t"><b>${esc(nice(t.a))}</b><span class="sub">${esc(nice(t.loc))}${others.length?" · com "+others.join(", "):""}</span>
        ${c?`<br><span class="done-by">Feito${c.at?" às "+hhmm(c.at):""}${c.by&&names[c.by]?" por "+esc(names[c.by]):""}</span>`:""}</span>
        <span class="time">${t.h}</span></button>`}).join(""):`<div class="empty">Sem funções no MICRO para ${p} neste dia.</div>`}</div>`;
  });
  if(st.allDays&&!T.some(t=>t.p.includes(p)))h+=`<div class="card"><div class="empty">Sem funções para ${p}.</div></div>`;
  return h;
}

/* ---------- PROGRAMAÇÃO ---------- */
function vProg(){
  const p=PROG[st.day]||[];
  let h=dayHead(p.length?`Programação prévia da delegação · ${p.length} atividades`:"");
  const add=canEdit()?`<div class="addrow"><button class="btn o sm" data-new="prog">+ Nova atividade</button></div>`:"";
  if(!p.length)return h+add+`<div class="card"><div class="empty">Sem programação da delegação neste dia. As funções da equipe estão em “Funções”.</div></div>`;
  h+=add;
  const dep=S.filter(s=>s.d===st.day&&s.u==="D");
  h+=`<div class="card">${p.map((x,i)=>{
    const nxt=p[i+1]?p[i+1][0]:"99:99";
    const v=dep.filter(s=>s.ini&&s.ini>=x[0]&&s.ini<nxt&&s.pax!=="BACKUP"&&/BUS/.test(s.v));
    return `<div class="prg ${x[3]?"key":""}" style="grid-template-columns:52px 1fr auto"><span class="time">${x[0]}</span><span><b>${esc(x[1])}</b> <span class="sub">· ${esc(x[2])}</span>
      ${v.length?`<div class="veh">🚌 ${v.map(s=>esc(veh(s.v))+" "+s.ini+" → "+esc(pl(s.legs[0]?s.legs[0].de:""))).join(" · ")}</div>`:""}${x[5]?"<br>"+edInfo({_ed:x[5],_new:x[4].startsWith("n")}):""}</span>${ebtn("prog",x[4])}</div>`}).join("")}</div>
  <p class="note">Fonte: Programação Prévia CAM (Sula 26 · CAM x BOC), com as edições feitas no app. Os ônibus da delegação aparecem embaixo da atividade em que saem.</p>`;
  return h;
}

/* ---------- EDITAR ---------- */
const PLACES=[...new Set(SBASE.flatMap(s=>s.legs.flatMap(g=>[g.o,g.de])).filter(Boolean))].sort();
let form=null;
const opt=(v,cur,l)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l??v)}</option>`;
const dayOpts=cur=>DAYS.map(d=>opt(d.id,cur,d.ds+" "+d.dd)).join("");
function findItem(kind,id){return kind==="svc"?S.find(x=>x.id===id):kind==="task"?T.find(x=>x.id===id):(()=>{for(const d in PROG){const x=PROG[d].find(r=>r[4]===id);if(x)return {id,d,h:x[0],n:x[1],loc:x[2],key:!!x[3],_ed:x[5]}}})()}
function isBase(kind,id){return (kind==="svc"?SBASE:kind==="task"?TBASE:PBASE).some(b=>b.id===id)}
function openEdit(kind,id){
  const x=id?findItem(kind,id):null;
  if(id&&!x){toast("Item não encontrado");return}
  form={kind,id,base:id?isBase(kind,id):false,del:false,
    legs:kind==="svc"?(x?x.legs.map(g=>({...g})):[{h:"",o:"HILTON GARDEN INN",de:""}]):null,
    x:x||(kind==="svc"?{d:st.day,n:"",v:"",act:"",u:"D",g:"",r:"",cap:"",pax:"",ini:"",fim:"",ped:"",conf:"-"}:kind==="task"?{d:st.day,h:"",a:"",loc:"",op:"",g:"",p:[]}:{d:st.day,h:"",n:"",loc:"",key:false})};
  drawEdit();$("#sheet").hidden=false;
}
function legRows(){return form.legs.map((g,i)=>`<div class="legrow"><input type="time" aria-label="Hora do trecho ${i+1}" data-leg="${i}" data-f="h" value="${esc(g.h)}"><input list="places" aria-label="Origem do trecho ${i+1}" data-leg="${i}" data-f="o" value="${esc(g.o)}" placeholder="Origem"><input list="places" aria-label="Destino do trecho ${i+1}" data-leg="${i}" data-f="de" value="${esc(g.de)}" placeholder="Destino"><button type="button" data-delleg="${i}" aria-label="Remover trecho ${i+1}">×</button></div>`).join("")}
function drawEdit(){
  const {kind,x}=form, title={svc:"veículo",task:"função",prog:"atividade"}[kind];
  let f="";
  if(kind==="svc")f=`<div class="fgrid">
    <label class="fld">Dia<select id="f-d">${dayOpts(x.d)}</select></label>
    <label class="fld">Nº<input id="f-n" value="${esc(x.n)}"></label>
    <label class="fld">Veículo<input id="f-v" value="${esc(x.v)}" required placeholder="Ex.: BUS 1, VAN 2"></label>
    <label class="fld">Usuário<select id="f-u">${opt("D",x.u,"Delegação")}${opt("F",x.u,"Família & convidados")}</select></label>
    <label class="fld full">Atividade<textarea id="f-act">${esc((x.act||"").split("|").map(t=>t.trim()).join("\n"))}</textarea></label>
    <label class="fld">Grupo<input id="f-g" value="${esc(x.g)}"></label>
    <label class="fld">Responsável<input id="f-r" value="${esc(x.r)}"></label>
    <label class="fld">Capacidade<input id="f-cap" value="${esc(x.cap)}"></label>
    <label class="fld">PAX<input id="f-pax" value="${esc(x.pax)}"></label>
    <label class="fld">Início<input id="f-ini" type="time" value="${esc(x.ini)}"></label>
    <label class="fld">Término<input id="f-fim" type="time" value="${esc(x.fim)}"></label>
    <label class="fld">Pedido nº ou CONMEBOL<input id="f-ped" list="dl-ped" value="${esc(x.ped)}" placeholder="vazio = SEM PEDIDO"><datalist id="dl-ped"><option value="CONMEBOL"></datalist></label>
    <label class="fld">Confirmação<select id="f-conf">${opt("-",x.conf==="CONFIRMADO"?"":"-","A confirmar")}${opt("CONFIRMADO",x.conf,"Confirmado")}</select></label>
    <div class="fld full">Trechos<div id="legs" style="display:flex;flex-direction:column;gap:6px">${legRows()}</div>
      <button type="button" class="btn o sm" id="addleg" style="align-self:flex-start">+ Trecho</button></div>
    <datalist id="places">${PLACES.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>`;
  if(kind==="task")f=`<div class="fgrid">
    <label class="fld">Dia<select id="f-d">${dayOpts(x.d)}</select></label>
    <label class="fld">Hora<input id="f-h" type="time" value="${esc(x.h)}" required></label>
    <label class="fld full">Função<input id="f-a" value="${esc(x.a)}" required></label>
    <label class="fld">Local<input id="f-loc" value="${esc(x.loc)}"></label>
    <label class="fld">Operação<input id="f-op" value="${esc(x.op)}"></label>
    <label class="fld full">Grupo<input id="f-g" value="${esc(x.g)}"></label>
    <div class="fld full">Responsáveis<div class="pchecks">${[...new Set([...PEOPLE,...x.p])].map(p=>`<label><input type="checkbox" name="fp" value="${esc(p)}"${x.p.includes(p)?" checked":""}> ${esc(p)}</label>`).join("")}</div></div></div>`;
  if(kind==="prog")f=`<div class="fgrid">
    <label class="fld">Dia<select id="f-d">${dayOpts(x.d)}</select></label>
    <label class="fld">Hora<input id="f-h" type="time" value="${esc(x.h)}" required></label>
    <label class="fld full">Atividade<input id="f-n" value="${esc(x.n)}" required></label>
    <label class="fld">Local<input id="f-loc" value="${esc(x.loc)}"></label>
    <div class="fld">Destaque<div class="pchecks"><label><input type="checkbox" id="f-key"${x.key?" checked":""}> Marco do dia</label></div></div></div>`;
  $("#sheet").innerHTML=`<div role="dialog" aria-label="Editar ${title}"><form id="ef" novalidate style="display:flex;flex-direction:column;gap:14px">
    <div class="shead"><h3>${form.id?"Editar":"Novo"} ${title}</h3><button type="button" class="btn o sm" data-close>Cancelar</button></div>
    ${form.id&&x._ed?`<p class="sub" style="margin:0">${edInfo(x)}</p>`:""}
    ${f}
    <p class="sub" id="ferr" style="margin:0;color:#B3261E" hidden></p>
    <div class="factions"><div class="l">
      ${form.id?`<button type="button" class="btn danger sm" id="fdel">${form.del?"Confirmar exclusão":"Excluir"}</button>`:""}
      ${form.id&&form.base&&x._ed?`<button type="button" class="btn o sm" id="frest">Voltar ao original</button>`:""}</div>
      <button type="submit" class="btn">Salvar</button></div></form></div>`;
  wireEdit();
}
function readLegs(){document.querySelectorAll("#legs [data-leg]").forEach(i=>{form.legs[+i.dataset.leg][i.dataset.f]=i.value.trim()})}
function wireEdit(){
  const al=$("#addleg"); if(al)al.onclick=()=>{readLegs();keepFields();form.legs.push({h:"",o:"",de:""});drawEdit()};
  document.querySelectorAll("[data-delleg]").forEach(b=>b.onclick=()=>{readLegs();keepFields();form.legs.splice(+b.dataset.delleg,1);drawEdit()});
  const del=$("#fdel"); if(del)del.onclick=()=>{if(!form.del){keepFields();form.del=true;drawEdit();return}saveEdit(form.kind,form.id,null,true)};
  const rs=$("#frest"); if(rs)rs.onclick=()=>restoreEdit(form.id);
  $("#ef").addEventListener("submit",e=>{e.preventDefault();const d=collect();if(!d)return;saveEdit(form.kind,form.id,d,false)});
}
const val=id=>{const e=$(id);return e?e.value.trim():""};
function keepFields(){const d=collect(true);if(d)form.x={...form.x,...d}}
function collect(quiet){
  const k=form.kind, err=m=>{if(quiet)return null;const e=$("#ferr");e.textContent=m;e.hidden=false;return null};
  if(k==="svc"){readLegs();
    const d={d:val("#f-d"),n:val("#f-n"),v:val("#f-v").toUpperCase(),act:val("#f-act").split("\n").map(t=>t.trim()).filter(Boolean).join(" | "),u:val("#f-u"),
      g:val("#f-g").toUpperCase(),r:val("#f-r").toUpperCase(),cap:val("#f-cap"),pax:val("#f-pax").toUpperCase(),ini:val("#f-ini"),fim:val("#f-fim"),ped:val("#f-ped").trim().toUpperCase()==="CONMEBOL"?"CONMEBOL":val("#f-ped").trim(),conf:val("#f-conf"),
      obs:form.x.obs||"",legs:form.legs.filter(g=>g.h||g.o||g.de).map(g=>({...g,o:(g.o||"").toUpperCase(),de:(g.de||"").toUpperCase()}))};
    if(!d.v&&!quiet)return err("Informe o veículo.");
    if(!d.legs.length&&!quiet)return err("Inclua pelo menos um trecho.");
    if(!d.legs.length)d.legs=form.legs;
    return d}
  if(k==="task"){
    const d={d:val("#f-d"),h:val("#f-h"),a:val("#f-a").toUpperCase(),loc:val("#f-loc").toUpperCase(),op:val("#f-op").toUpperCase(),g:val("#f-g").toUpperCase(),
      p:[...document.querySelectorAll('input[name="fp"]:checked')].map(i=>i.value)};
    if(!quiet){if(!d.h)return err("Informe a hora.");if(!d.a)return err("Informe a função.");if(!d.p.length)return err("Marque pelo menos um responsável.")}
    return d}
  const d={d:val("#f-d"),h:val("#f-h"),n:val("#f-n"),loc:val("#f-loc"),key:!!($("#f-key")&&$("#f-key").checked)};
  if(!quiet){if(!d.h)return err("Informe a hora.");if(!d.n)return err("Informe a atividade.")}
  return d}
const newId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function saveEdit(kind,id,data,deleted){
  if(!canEdit()){toast("Sem permissão para editar");return}
  const isNew=!id; if(isNew)id=newId();
  const base=isBase(kind,id);
  if(deleted&&!base){return removeEdit(id,"Excluído")}
  const doc={kind,base,data:deleted?null:data,deleted:!!deleted,at:new Date().toISOString(),by:myId||null};
  const prev=edits.get(id); edits.set(id,doc); applyEdits();

async function saveNote(id,t){
  if(!canEdit()){toast("Sem permissão para editar");return}

  const keep=!t&&NB[id];
  if(t||keep)notes.set(id,{t,at:new Date().toISOString(),by:myId||null,...(keep?{cleared:true}:{})});else notes.delete(id);
  $("#sheet").hidden=true;render();
  if(mode!=="db"){ls.set("op-notes",JSON.stringify([...notes]));toast(t?"Observação salva":"Observação apagada");return}
  try{const ref=dbRef.collection("notes").doc(id);if(t||keep)await ref.set(notes.get(id));else await ref.delete();toast(t?"Observação salva":"Observação apagada")}
  catch(e){if(prev)notes.set(id,prev);else notes.delete(id);render();
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("Sem permissão para editar")}else toast("Não foi possível salvar. Tente de novo.")}

async function syncLocalNotes(db){
  let loc=[];try{loc=JSON.parse(ls.get("op-notes")||"[]")}catch(_){}
  if(!loc.length||readOnly)return;
  let n=0;
  for(const [id,v] of loc){
    if(!v||!v.t||notes.has(id)||!S.some(x=>x.id===id))continue;
    try{await db.collection("notes").doc(id).set({t:v.t,at:v.at||new Date().toISOString(),by:v.by||myId||null});n++}catch(_){return}
  }
  ls.set("op-notes","[]");
  if(n)toast(n+(n>1?" observações deste aparelho foram compartilhadas":" observação deste aparelho foi compartilhada"));
}

async function toggleCnf(group,index){
  if(readOnly){toast("Sem permissão para marcar");return}
  const key=cnfKey(group,index), was=cnfChecks.has(key);
  if(was)cnfChecks.delete(key);else cnfChecks.set(key,{at:new Date().toISOString(),by:myId||null});
  render();
  if(mode!=="db"){ls.set("op-cnf-checks",JSON.stringify([...cnfChecks]));return}
  try{
    const ref=dbRef.collection("cnfAttendance").doc(key);
    if(was)await ref.delete();else await ref.set({group,index,name:([...(CNF_LISTS[group]||[]),...(cnfAdded[group]||[])])[index],at:new Date().toISOString(),by:myId||null});
  }catch(e){
    if(was)cnfChecks.set(key,{at:null,by:null});else cnfChecks.delete(key);
    render();toast("Não foi possível salvar a marcação. Tente novamente.");
  }
}
function loadCnfLocal(){try{const a=JSON.parse(ls.get("op-cnf-checks")||"[]");cnfChecks.clear();a.forEach(([k,v])=>cnfChecks.set(k,v))}catch(_){}loadCnfExtras()}

/* ---------- render ---------- */
function render(){
  renderHead();
  $("#view").innerHTML=(mode==="local"?`<div class="banner">As marcações e edições estão sendo salvas só neste aparelho. A equipe não vê o que você mudar aqui.</div>`:"")+
    (readOnly?`<div class="banner">Você pode ver tudo, mas não marcar nem editar. Peça acesso de Editor ao Guilherme.</div>`:"")+
    (st.tab==="cnf"?vCnf():st.tab==="transp"?vTransp():st.tab==="prog"?vProg():st.tab==="func"?vFunc():st.tab==="macro"?vMacro():vPess());
  if(st.openV){const el=document.getElementById("veh-"+st.openV);if(el){el.scrollIntoView({block:"center"});st.openV=null}}
}

/* ---------- marcação ---------- */
const busy=new Set();
async function toggle(tid,p){
  if(readOnly){toast("Sem permissão para marcar");return}
  const k=ckey(tid,p); if(busy.has(k))return;
  const was=checks.get(k);
  if(was)checks.delete(k);else checks.set(k,{at:new Date().toISOString(),by:myId});
  render();
  if(mode!=="db"){saveLocal();return}
  busy.add(k);
  try{
    const ref=dbRef.collection("checks").doc(k);
    if(was)await ref.delete();else await ref.set({task:tid,person:p,at:new Date().toISOString(),by:myId||null});
  }catch(e){
    if(was)checks.set(k,was);else checks.delete(k);
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("Sem permissão para marcar")}
    else if(e&&e.code==="quota_exceeded")toast("Armazenamento cheio. Avise o Guilherme.");
    else toast("Não foi possível salvar. Tente de novo.");
    render();
  }finally{busy.delete(k)}
}
async function setAssign(id,p){
  if(!canEdit()){toast("Sem permissão para atribuir");return}
  if(busy.has("as"+id))return;
  const prev=assign.get(id), off=prev&&prev.p===p;
  if(off)assign.delete(id);else assign.set(id,{p,at:new Date().toISOString(),by:myId||null});
  render();
  if(mode!=="db"){ls.set("op-assign",JSON.stringify([...assign]));toast(off?"Sem atribuição":"Atribuído a "+p);return}
  busy.add("as"+id);
  try{const ref=dbRef.collection("assign").doc(id);if(off)await ref.delete();else await ref.set(assign.get(id));toast(off?"Sem atribuição":"Atribuído a "+p)}
  catch(e){if(prev)assign.set(id,prev);else assign.delete(id);render();
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("Sem permissão para atribuir")}else toast("Não foi possível salvar. Tente de novo.")}
  finally{busy.delete("as"+id)}
}
function saveLocal(){ls.set("op-checks",JSON.stringify([...checks]))}
function loadLocal(){try{const a=JSON.parse(ls.get("op-checks")||"[]");checks.clear();a.forEach(([k,v])=>checks.set(k,v))}catch(_){}
  try{const a=JSON.parse(ls.get("op-assign")||"[]");assign.clear();a.forEach(([k,v])=>assign.set(k,v))}catch(_){}
  try{const a=JSON.parse(ls.get("op-notes")||"[]");notes.clear();a.forEach(([k,v])=>notes.set(k,v))}catch(_){}}

let myId=null;
async function resolveNames(){
  if(!userNS)return;
  const ids=[...new Set([...checks.values(),...edits.values(),...notes.values()].map(c=>c.by).filter(Boolean))];
  if(!ids.length)return;
  const ps=await userNS.profiles(ids); let ch=false;
  ids.forEach(id=>{const n=ps[id]&&ps[id].name||"";if(names[id]!==n){names[id]=n;ch=true}});
  if(ch)render();
}
async function boot(){
  render();
  const fallback=()=>{if(mode==="loading"){mode="local";loadLocal();loadLocalEdits();loadCnfLocal();render()}};
  const timer=setTimeout(fallback,10000);
  let db=null;
  for(let i=0;i<50&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
  try{ if(window.claude&&window.claude.use){ [db,userNS]=await Promise.all([window.claude.use("db"),window.claude.use("user")]) } }catch(_){}
  if(!db){clearTimeout(timer);fallback();return}
  dbRef=db;
  try{myId=userNS?await userNS.id():null;const w=userNS?await userNS.can("data.write"):null;if(w===false)readOnly=true}catch(_){}
  db.collection("checks").onSnapshot(snap=>{
    clearTimeout(timer); mode="db";
    checks.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v)checks.set(d.id,{at:v.at,by:v.by})});
    render(); resolveNames();
  },err=>{clearTimeout(timer);if(mode!=="db"){mode="local";loadLocal();loadLocalEdits();loadCnfLocal()}render()});
  db.collection("cnfAttendance").onSnapshot(snap=>{
    cnfChecks.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.group&&Number.isInteger(v.index))cnfChecks.set(d.id,{at:v.at,by:v.by})});
    if($("#sheet").hidden)render();
  },()=>{});
  db.collection("edits").onSnapshot(snap=>{
    edits.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.kind)edits.set(d.id,v)});
    applyEdits(); if($("#sheet").hidden)render(); resolveNames();
  },()=>{});
  let notesSynced=false;
  db.collection("notes").onSnapshot(snap=>{
    notes.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&(v.t||v.cleared))notes.set(d.id,v)});
    if(!notesSynced){notesSynced=true;syncLocalNotes(db)}
    if($("#sheet").hidden)render(); resolveNames();
  },()=>{});
  db.collection("assign").onSnapshot(snap=>{
    assign.clear();
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.p)assign.set(d.id,v)});
    if($("#sheet").hidden)render();
  },()=>{});
}

document.addEventListener("click",e=>{
  const g=k=>e.target.closest(`[${k}]`);let el;
  if(el=g("data-d")){st.day=el.dataset.d;render();window.scrollTo(0,0)}
  else if(el=g("data-t")){st.tab=el.dataset.t;render();window.scrollTo(0,0)}
  else if(el=g("data-cnf-tab")){st.cnfGroup=el.dataset.cnfTab;render()}
  else if(el=g("data-cnf-add")){const group=el.dataset.cnfAdd,input=document.getElementById("cnf-new-person"),name=(input?.value||"").trim();if(!name){toast("Digite o nome da pessoa");return}if(readOnly){toast("Sem permissão para editar");return}cnfAdded[group].push(name);saveCnfExtras();render();toast("Pessoa adicionada à lista")}
  else if(el=g("data-cnf-note-toggle")){const key=cnfKey(el.dataset.cnfNoteToggle,+el.dataset.cnfIndex);if(cnfOpenNotes.has(key))cnfOpenNotes.delete(key);else cnfOpenNotes.add(key);render()}
  else if(el=g("data-cnf-note")){const group=el.dataset.cnfNote,index=+el.dataset.cnfIndex,input=document.getElementById(`cnf-note-${group}-${index}`),key=cnfKey(group,index),note=(input?.value||"").trim();if(readOnly){toast("Sem permissão para editar");return}if(note)cnfObservations.set(key,note);else cnfObservations.delete(key);cnfOpenNotes.add(key);saveCnfExtras();render();toast("Observação salva")}
  else if(el=g("data-cnf")){toggleCnf(el.dataset.cnf,+el.dataset.cnfIndex)}
  else if(el=g("data-tv")){st.tv=el.dataset.tv;render()}
  else if(el=g("data-who")){st.who=el.dataset.who;render()}
  else if(g("data-prog")){st.prog=!st.prog;render()}
  else if(el=g("data-as")){setAssign(el.dataset.as,el.dataset.p)}
  else if(el=g("data-note")){openNote(el.dataset.note)}
  else if(el=g("data-lg")){st.lg=el.dataset.lg;render()}
  else if(el=g("data-goveh")){if(el.dataset.d2)st.day=el.dataset.d2;st.tab="transp";st.tv="veh";st.who="all";st.lg="";st.openV=el.dataset.goveh;render();window.scrollTo(0,0)}
  else if(el=g("data-ck")){toggle(el.dataset.ck,el.dataset.p)}
  else if(el=g("data-person")){st.person=el.dataset.person;ls.set("op-person",st.person);render()}
  else if(el=g("data-goperson")){st.person=el.dataset.goperson;ls.set("op-person",st.person);st.tab="pess";render();window.scrollTo(0,0)}
  else if(el=g("data-all")){st.allDays=el.dataset.all==="1";render()}
  else if(el=g("data-edit")){openEdit(el.dataset.edit,el.dataset.id)}
  else if(el=g("data-new")){openEdit(el.dataset.new,null)}
  else if(g("data-msg")){openMsg()}
  else if(g("data-pdf")){pdfMissao(st.person,st.allDays)}
  else if(g("data-pdft")){pdfTransportes()}
  else if(g("data-close")||e.target.id==="sheet"){$("#sheet").hidden=true;render()}
});

document.addEventListener("input",e=>{
  if(e.target&&e.target.id==="cnf-search"){
    const query=e.target.value.trim().toLocaleLowerCase("pt-BR");
    st.cnfSearch=e.target.value;
    const rows=document.querySelectorAll("#cnf-people-list .cnf-person-wrap");
    let visible=0;
    rows.forEach(row=>{const match=(row.dataset.cnfPersonName||"").includes(query);row.hidden=!match;if(match)visible++});
    const empty=document.getElementById("cnf-no-results");if(empty)empty.hidden=visible>0;
  }
});
boot();
</script>
